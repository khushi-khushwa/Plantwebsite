 <div class="checkout-container"> 
  <div class="row">
  <!-- Order Summary Section  -->
    <div class="col-lg-4">
      <div class="order-summary">
        <div *ngIf="deliverdata" class="card">
          <div class="card-header">
            <h3>Order Summary</h3>
          </div>
          <div class="card-body">
            <div class="product-details">
              <img [src]="deliverdata.image" class="product-image" alt="Product image" />
              <div class="product-info">
                <h4>{{ deliverdata.name }}</h4>
                
                <div class="quantity-control">
                  <span>Quantity:</span>
                  <button class="btn-circle" (click)="minus()">
                    <i class="fas fa-minus"></i>
                  </button>
                  <span class="quantity-value">{{ value }}</span>
                  <button class="btn-circle" (click)="add()">
                    <i class="fas fa-plus"></i>
                  </button>
                </div>
              </div>
            </div>
            
            <div class="price-details">
              <div class="price-row">
                <span>Price</span>
                <span>{{ deliverdata.price }}</span>
              </div>
              <div class="price-row">
                <span>Delivery Fee</span>
                <span>Rs. {{ deliverycharge }}</span>
              </div>
              <div class="divider"></div>
              <div class="price-row total">
                <span>Total</span>
                <span>{{ totalpay }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Checkout Form Section -->
   <div class="col-lg-8">
  <div class="checkout-form-container">
    <form [formGroup]="orderDetail">
      <mat-horizontal-stepper [linear]="isLinear" class="checkout-stepper">

        <mat-step
          *ngFor="let data of buyData; let k = index"
          [stepControl]="orderDetail.get(data.formGroupname)"
          label="{{ data.formGroupname }}">

          <div class="step-content">
            <ng-container [formGroupName]="data.formGroupname">

              <div *ngIf="data.formControl.length > 0" class="form-fields">
                <div *ngFor="let controls of data.formControl; let i = index" class="field-wrapper">

                  <!--  text / email / number inputs -->
                  <div *ngIf="controls.type !== 'radio'" class="input-field">
                    <mat-form-field appearance="outline">
                      <mat-label>{{ controls.placeholder }}</mat-label>
                      <input matInput
                             [type]="controls.type"
                             [formControlName]="controls.name" />
                      <mat-error
                        *ngIf="orderDetail.get(data.formGroupname)?.get(controls.name)?.invalid">
                        This field is required
                      </mat-error>
                    </mat-form-field>
                  </div>

                  <!-- ── Payment radio group ── -->
                  <div *ngIf="controls.type === 'radio'" class="radio-field">
                    <div class="payment-option">

                      <ng-container *ngFor="let d of controls.option">

                       
                        <label class="radio-container">
                          <input
                            type="radio"
                            formControlName="paymentMethod"
                            [value]="d.method"
                            (click)="inputOpen(d.name)" />
                          <span class="radio-label">{{ d.name }}</span>
                          <span class="checkmark"></span>
                        </label>

                        <!-- ── Expandable detail panels ── -->
                        <div *ngIf="d.moreoption === 'add'" class="payment-details">

                          <!-- Credit / Debit card fields -->
                          <div
                            *ngIf="d.name === 'Credit/Debit' && carditem"
                            formGroupName="Credit/Debit"
                            class="payment-method-details active">
                                <ng-container *ngFor="let nestedvalue of d.detail">
                 <mat-form-field appearance="outline">
                              <mat-label>{{nestedvalue.method}}</mat-label>
                              <input matInput type="text" formControlName="cardNumber" />
                            </mat-form-field>
                                </ng-container>
                           
                          </div>

                          <!-- Net Banking bank list -->
                          <div
                            *ngIf="d.name === 'NetBanking' && netOption"
                            formGroupName="NetBanking"
                            class="payment-method-details active">

                            <div *ngFor="let detail of d.detail" class="bank-option">
                              <label class="radio-container">
                              
                                <input
                                  type="radio"
                                  formControlName="selectedBank"
                                  [value]="detail.name" />
                                <span class="radio-label">{{ detail.name }}</span>
                                <span class="checkmark"></span>
                              </label>
                            </div>
                          </div>

                        </div>
                        <!-- /moreoption -->

                      </ng-container>
                    </div>
                  </div>
                  <!-- /radio -->

                </div>
              </div>
            </ng-container>

            <!-- ── Step navigation ── -->
            <div class="step-actions">
              <button *ngIf="k > 0"
                      mat-button matStepperPrevious class="btn-secondary">
                <i class="fas fa-arrow-left"></i> Previous
              </button>

              <button *ngIf="k < 2"
                      mat-button matStepperNext class="btn-primary"
                      [disabled]="!orderDetail.get(data.formGroupname)?.valid">
                Next <i class="fas fa-arrow-right"></i>
              </button>

              <button *ngIf="k === 2"
                      mat-button class="btn-success"
                      (click)="orderConfirm()">
                Complete Order <i class="fas fa-check"></i>
              </button>
            </div>

          </div>
        </mat-step>

      </mat-horizontal-stepper>
    </form>
  </div>
</div>
 </div>
 </div>
