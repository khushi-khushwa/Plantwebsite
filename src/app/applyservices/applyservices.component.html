<div class="container py-4">
  <div class="text-center mb-5">
    <h3 class="fw-bold">🌿 Your Services</h3>
    <p class="text-muted">Track your applied services</p>
  </div>

  <div class="timeline">

    <div *ngFor="let data of order; let i = index" class="timeline-item">

      <!-- DOT -->
      <div class="timeline-dot"></div>

      <!-- CARD -->
      <div class="timeline-card">

        <div class="card-header">
          <h5>{{data.title}}</h5>
          <span class="price">₹{{data.charges}}</span>
        </div>

        <p class="desc" *ngIf="data.description">
          {{data.description}}
        </p>

        <div class="card-footer">
          <span class="index">#{{i + 1}}</span>

          <div class="actions">
            <!-- <button class="view-btn">View</button> -->
            <button (click)="cancel(data._id)" class="delete-btn">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>
</div>
