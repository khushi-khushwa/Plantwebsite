<div class="form-container">
    <!-- Girl Image -->
    <div class="girlimage">
        <img src="../../assets/signup-02.png" alt="Girl Illustration" />
    </div>

    <!-- Boy Image -->
    <div class="boyimage">
        <img src="../../assets/signup-03.png" alt="Boy Illustration" />
    </div>

    <!-- Form Section -->
    <div class="formrow">
        <div class="form_align form-box">
            <form [formGroup]="signupForm">
                <div class="logo-img">
                    <img src="../../assets/shyam-01.png" alt="Company Logo">
                </div>

                <div class="d-flex flex-column my-4">
                    <input type="text" placeholder="First Name" class="form-control" formControlName="firstname" />
                </div>

                <div class="d-flex flex-column my-4">
                    <input type="text" placeholder="Last Name" class="form-control" formControlName="lastname" />
                </div>

                <div class="d-flex flex-column my-4">
                    <input type="email" placeholder="Enter email" class="form-control" formControlName="email" />
                </div>

                <div class="d-flex flex-column my-4">
                    <input type="password" placeholder="Password" class="form-control" formControlName="password" />
                </div>

                <div class="d-flex justify-content-center">
                    <button class="button p-2 text-white" [disabled]="!signupForm.valid" (click)="submit()">Signup</button>
                </div>
            </form>
        </div>
    </div>
</div>
