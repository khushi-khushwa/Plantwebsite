    <div class="profile-container">
        <div class="background-shapes">
          <div class="shape shape-1"></div>
          <div class="shape shape-2"></div>
          <div class="shape shape-3"></div>
          <div class="shape shape-4"></div>
        </div>
        
        <div class="form-card">
          <div class="logo-container">
            <img src="../../assets/shyam-01.png" alt="Company Logo" class="company-logo">
          </div>
          
          <h2 class="form-title">Update Profile</h2>
          
          <form [formGroup]="updateProfile">
            <div class="form-group">
              <div class="input-container">
                <i class="input-icon fa fa-user"></i>
                <input type="text" placeholder="First Name" class="form-control" formControlName="firstname" />
              </div>
            </div>
            
            <div class="form-group">
              <div class="input-container">
                <i class="input-icon fa fa-user"></i>
                <input type="text" placeholder="Last Name" class="form-control" formControlName="lastname" />
              </div>
            </div>
            
            <div class="form-group">
              <div class="input-container">
                <i class="input-icon fa fa-envelope"></i>
                <input type="email" placeholder="Enter email" class="form-control" formControlName="email" />
              </div>
            </div>
            
            <div class="form-group">
              <div class="input-container">
                <i class="input-icon fa fa-lock"></i>
                <input type="password" placeholder="Password" class="form-control" formControlName="password" />
                <i class="password-toggle fa fa-eye"></i>
              </div>
            </div>
            
            <div class="form-actions">
              <button class="update-btn" type="submit" [disabled]="!updateProfile.valid" (click)="update()">
                Update Profile
              </button>
            </div>
          </form>
        </div>
        
      </div>
