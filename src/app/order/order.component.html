<!-- order-list.component.html -->
<div class="container py-4">
    <h4 class="mb-4">Your Orders</h4>
    
    <div class="row">
      <div class="col-12" *ngFor="let orderitem of order">
        <div class="order-card p-3 mb-3">
          <div class="d-flex justify-content-between order-flex">
            <div class="order-details">
              <h5 class="order-name">{{orderitem.name}}</h5>
              <p class="price-tag mb-1">Total Price: <span class="fw-bold">Rs. {{orderitem.totalpay}}</span></p>
              <p class="price-tag mb-1">Price per item: <span class="text-muted">Rs. {{orderitem.price}}</span></p>
              <div class="delivery-info">
                <i class="bi bi-truck me-2"></i>
                <span>{{orderitem.date | date}}</span>
              </div>
              <!-- <div class="mt-3">
                <span class="badge-custom">{{orderitem.status || 'Processing'}}</span>
              </div> -->
            </div>
            
            <div class="order-image-container d-flex align-items-center">
              <img [src]="orderitem.image" alt="Product Image" class="order-image">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
